<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wonyoung × Dior Summer 2027 Copy Generator</title>
<style>
:root{--bg:#171b2b;--panel:#101522;--text:#fff;--muted:#aeb7cc;--accent:#c12c63;--accent2:#ff6fa8;--accent3:#ff8eb8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:30px 42px 46px}.hero{text-align:center;margin-bottom:28px}h1{margin:0;font-size:22px;letter-spacing:.09em;font-weight:800;color:#ff7baa;text-transform:uppercase}.subtitle{margin-top:8px;color:#d7dceb;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.output-wrap{position:relative;margin-top:32px}.badge{position:absolute;top:-12px;left:18px;z-index:2;background:var(--accent);color:#fff;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:800}.output{min-height:178px;border:1.5px solid var(--accent);border-radius:10px;background:var(--panel);padding:54px 32px 30px;display:flex;align-items:center;justify-content:flex-start;text-align:left;white-space:pre-wrap;font-size:15px;line-height:1.55;color:#fff}.copy-btn{position:absolute;top:14px;right:14px;z-index:2;border:0;background:var(--accent2);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:12px}.random-title{text-align:center;font-size:12px;font-weight:800;margin:25px 0 12px;letter-spacing:.03em;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gen{border:1.5px solid var(--accent3);border-radius:7px;padding:12px 14px;cursor:pointer;font-weight:800;font-size:14px;min-height:42px;color:#fff;background:var(--accent);transition:.15s ease}.gen:hover{transform:translateY(-1px);filter:brightness(1.07)}.gen.active{background:#d93473;box-shadow:0 0 0 2px rgba(255,111,168,.18)}.note{margin-top:15px;text-align:center;font-size:11px;line-height:1.5;color:var(--muted)}.footer{text-align:center;color:#768198;font-size:10px;margin-top:18px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.wrap{padding:24px 18px 38px}.grid{grid-template-columns:1fr}.output{min-height:190px;padding:56px 22px 26px;font-size:14px}h1{font-size:18px}.copy-btn{top:13px;right:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>✨ DIOR SUMMER 2027 ✨</h1><div class="subtitle">Jang Wonyoung × Dior · Paris Fashion Week</div></div>
  <div class="output-wrap"><div class="badge" id="modeLabel">Wonyoung Comments</div><button class="copy-btn" id="copyBtn">📄 Copy</button><div class="output" id="output"></div></div>
  <div class="random-title">CLICK TO RANDOM</div>
  <div class="grid"><button class="gen active" data-type="comments">Wonyoung Comments</button><button class="gen" data-type="captions">Wonyoung Captions</button></div>
  <div class="note">Comments are generated without hashtags. Captions automatically include the Dior event tags.</div>
  <div class="footer">Fan-made random copy generator</div>
</div>
<div class="toast" id="toast">Copied!</div>
<script>
const content={
comments:[
"Wonyoung looks absolutely stunning — Dior suits her elegance so naturally.",
"Jang Wonyoung and Dior are such a perfect match. The elegance is effortless.",
"Her fashion presence is incredible. Every detail looks refined and intentional.",
"Wonyoung makes every fashion week appearance feel like a major moment.",
"Dior really chose the right person — Wonyoung carries this look beautifully.",
"Her proportions, expression and confidence make this entire look unforgettable.",
"Wonyoung has that rare ability to make high fashion feel both elegant and fresh.",
"This styling fits Wonyoung perfectly. She looks polished from every angle.",
"She doesn't just wear the look, she gives it a whole mood of its own.",
"Wonyoung's camera presence is on another level. She makes every frame memorable.",
"Thank you Dior for inviting Wonyoung. This collaboration feels so natural.",
"The combination of Dior and Wonyoung is exactly the kind of fashion moment I wanted to see.",
"Wonyoung's elegance feels completely effortless here.",
"Another fashion week, another iconic Wonyoung moment.",
"She looks graceful, confident and incredibly sophisticated."
],
captions:[
"Thank you Dior for inviting Jang Wonyoung to Paris Fashion Week. Her elegant image and strong fashion presence make this collaboration feel especially exciting.",
"Wonyoung and Dior feel like such a natural match. Her refined aura brings the look to life while still keeping her own unmistakable charm.",
"Jang Wonyoung once again shows why she stands out in fashion. Elegant, polished and confident from every angle.",
"A beautiful meeting of Dior's timeless elegance and Wonyoung's modern star power. Every detail feels perfectly balanced.",
"Wonyoung turns every fashion appearance into a moment worth remembering. Can't wait to see more from her time with Dior in Paris.",
"Dior chose well. Wonyoung's presence is graceful, modern and instantly recognizable — exactly the kind of energy that shines at Paris Fashion Week.",
"From the styling to her expressions, Wonyoung makes the whole look feel effortless. This Dior moment is already one to remember.",
"Jang Wonyoung continues to prove how naturally she fits the fashion world. Her poise and visual impact are impossible to ignore.",
"Wonyoung brings her own elegant energy to Dior and makes every frame feel special. Such a beautiful fashion week moment.",
"Paris Fashion Week looks even brighter with Wonyoung there. Thank you Dior for giving us this gorgeous moment."
]};
const tags="#JANGWONYOUNG #WONYOUNG\n#DiorSummer27 @Dior";
let type="comments", last=-1; const output=document.getElementById('output'), modeLabel=document.getElementById('modeLabel');
function randomize(){const arr=content[type];let i=Math.floor(Math.random()*arr.length);if(arr.length>1&&i===last)i=(i+1)%arr.length;last=i;output.textContent=type==='comments'?arr[i]:arr[i]+'\n\n'+tags;modeLabel.textContent=type==='comments'?'Wonyoung Comments':'Wonyoung Captions';}
document.querySelectorAll('.gen').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.gen').forEach(x=>x.classList.remove('active'));btn.classList.add('active');type=btn.dataset.type;last=-1;randomize();}));
document.getElementById('copyBtn').addEventListener('click',async()=>{const text=output.textContent;try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)});
randomize();
</script>
</body></html>
